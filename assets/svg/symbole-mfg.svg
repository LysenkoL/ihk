<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="420" height="150"
     role="img" aria-label="Zwei Gerätesymbole, nummeriert 1 und 2">
  <title>Symbole auf dem Multifunktionsgerät, Abbildungen 1 und 2</title>
  <desc>Abbildung 1: drei nach oben geöffnete Bögen über einem Punkt.
        Abbildung 2: eine senkrechte Linie mit zwei sich kreuzenden Schrägen,
        die oben und unten je ein Dreieck bilden.</desc>

  <style>
    .bog { fill: none; stroke: #14171C; stroke-width: 11; stroke-linecap: round; }
    .voll{ fill: #14171C; }
    .nr  { fill: none; stroke: #14171C; stroke-width: 2.5; }
    .nrt { font-family: "Segoe UI", -apple-system, Roboto, sans-serif; font-size: 17px;
           font-weight: 700; fill: #14171C; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .bog, .nr { stroke: #E8EAEE; }
      .voll { fill: #E8EAEE; }
      .nrt  { fill: #E8EAEE; }
    }
  </style>

  <!-- ============ 1 · WLAN ============ -->
  <rect class="nr" x="20" y="26" width="26" height="26" rx="3"/>
  <text class="nrt" x="33" y="45">1</text>
  <g transform="translate(120,112)">
    <path class="bog" d="M -49 -49 A 69 69 0 0 1 49 -49"/>
    <path class="bog" d="M -32 -32 A 45 45 0 0 1 32 -32"/>
    <path class="bog" d="M -15 -15 A 21 21 0 0 1 15 -15"/>
    <circle class="voll" cx="0" cy="-2" r="9"/>
  </g>

  <!-- ============ 2 · Bluetooth ============ -->
  <rect class="nr" x="248" y="26" width="26" height="26" rx="3"/>
  <text class="nrt" x="261" y="45">2</text>
  <g transform="translate(318,36) scale(3.6)">
    <path class="voll" d="M 11.71 5.71 L 6 0 H 5 v 7.59 L 0.41 3 L -1 4.41 L 4.59 10
                          L -1 15.59 L 0.41 17 L 5 12.41 V 20 h 1 l 5.71 -5.71
                          l -4.3 -4.29 l 4.3 -4.29 z
                          M 7 3.83 l 1.88 1.88 L 7 7.59 V 3.83 z
                          m 1.88 10.46 L 7 16.17 v -3.76 l 1.88 1.88 z"/>
  </g>
</svg>
