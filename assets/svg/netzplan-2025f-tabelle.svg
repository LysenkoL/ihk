<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 374" width="860" height="374"
     role="img" aria-label="Vorgangsliste mit Dauer und Vorgängern">
  <title>Vorgangsliste</title>
  <desc>Vorgänge mit Beschreibung, Dauer und Vorgängern.</desc>

  <style>
    .rahmen{fill:#FFFFFF;stroke:#14171C;stroke-width:1.8}
    .rahmen.krit{stroke-width:3.4}
    .rahmen.geg{fill:#F4F6F9}
    .trenn{stroke:#14171C;stroke-width:1.4}
    .name{font-family:"Segoe UI",-apple-system,Roboto,sans-serif;font-size:17px;
          font-weight:700;fill:#14171C;text-anchor:middle}
    .zahl{font-family:"Segoe UI",-apple-system,Roboto,sans-serif;font-size:14px;
          fill:#14171C;text-anchor:middle}
    .zahl.falsch{fill:#A8291F;font-weight:700}
    .ecke{font-family:"Segoe UI",-apple-system,Roboto,sans-serif;font-size:13px;
          font-weight:600;fill:#14171C}
    .ecke.falsch{fill:#A8291F}
    .kante{fill:none;stroke:#14171C;stroke-width:1.6}
    .kante.krit{stroke-width:3.2}
    .kopf{font-family:"Segoe UI",-apple-system,Roboto,sans-serif;font-size:15px;
          font-weight:700;fill:#14171C}
    .txt{font-family:"Segoe UI",-apple-system,Roboto,sans-serif;font-size:14px;fill:#14171C}
    .leg{font-family:"Segoe UI",-apple-system,Roboto,sans-serif;font-size:12.5px;
         font-weight:700;fill:#5E6570}
    .hilf{font-family:"Segoe UI",-apple-system,Roboto,sans-serif;font-size:12.5px;fill:#5E6570}
    .gitter{fill:none;stroke:#14171C;stroke-width:1.4}
    .zebra{fill:#F4F6F9}
    @media (prefers-color-scheme: dark){
      .rahmen{fill:#1B1F26;stroke:#E8EAEE} .rahmen.geg{fill:#232830}
      .trenn,.kante,.gitter{stroke:#E8EAEE}
      .name,.zahl,.ecke,.kopf,.txt{fill:#E8EAEE}
      .zahl.falsch,.ecke.falsch{fill:#E88178}
      .leg,.hilf{fill:#98A0AC}
      .zebra{fill:#232830}
    }
  </style>
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect class="zebra" x="20" y="84" width="820" height="30"/>
  <rect class="zebra" x="20" y="144" width="820" height="30"/>
  <rect class="zebra" x="20" y="204" width="820" height="30"/>
  <rect class="zebra" x="20" y="264" width="820" height="30"/>
  <rect class="zebra" x="20" y="324" width="820" height="30"/>
  <rect class="gitter" x="20" y="20" width="820" height="334"/>
  <line class="gitter" x1="20" y1="54" x2="840" y2="54"/>
  <line class="trenn" x1="20" y1="84" x2="840" y2="84" opacity="0.45"/>
  <line class="trenn" x1="20" y1="114" x2="840" y2="114" opacity="0.45"/>
  <line class="trenn" x1="20" y1="144" x2="840" y2="144" opacity="0.45"/>
  <line class="trenn" x1="20" y1="174" x2="840" y2="174" opacity="0.45"/>
  <line class="trenn" x1="20" y1="204" x2="840" y2="204" opacity="0.45"/>
  <line class="trenn" x1="20" y1="234" x2="840" y2="234" opacity="0.45"/>
  <line class="trenn" x1="20" y1="264" x2="840" y2="264" opacity="0.45"/>
  <line class="trenn" x1="20" y1="294" x2="840" y2="294" opacity="0.45"/>
  <line class="trenn" x1="20" y1="324" x2="840" y2="324" opacity="0.45"/>
  <line class="gitter" x1="90" y1="20" x2="90" y2="354"/>
  <line class="gitter" x1="560" y1="20" x2="560" y2="354"/>
  <line class="gitter" x1="710" y1="20" x2="710" y2="354"/>
  <line class="gitter" x1="840" y1="20" x2="840" y2="354"/>
  <text class="kopf" x="55" y="43" text-anchor="middle">Vorgang</text>
  <text class="kopf" x="100" y="43">Beschreibung</text>
  <text class="kopf" x="635" y="43" text-anchor="middle">Dauer in Stunden</text>
  <text class="kopf" x="775" y="43" text-anchor="middle">Vorgänger</text>
  <text class="name" x="55" y="74">A</text>
  <text class="txt" x="100" y="74">Kickoff Meeting</text>
  <text class="txt" x="635" y="74" text-anchor="middle">2</text>
  <text class="txt" x="775" y="74" text-anchor="middle">—</text>
  <text class="name" x="55" y="104">B</text>
  <text class="txt" x="100" y="104">Kundenanforderungen erfassen</text>
  <text class="txt" x="635" y="104" text-anchor="middle">25</text>
  <text class="txt" x="775" y="104" text-anchor="middle">A</text>
  <text class="name" x="55" y="134">C</text>
  <text class="txt" x="100" y="134">Design und Konzeptentwicklung</text>
  <text class="txt" x="635" y="134" text-anchor="middle">32</text>
  <text class="txt" x="775" y="134" text-anchor="middle">B</text>
  <text class="name" x="55" y="164">D</text>
  <text class="txt" x="100" y="164">Content-Erstellung</text>
  <text class="txt" x="635" y="164" text-anchor="middle">40</text>
  <text class="txt" x="775" y="164" text-anchor="middle">B</text>
  <text class="name" x="55" y="194">E</text>
  <text class="txt" x="100" y="194">Webentwicklung</text>
  <text class="txt" x="635" y="194" text-anchor="middle">70</text>
  <text class="txt" x="775" y="194" text-anchor="middle">C, D</text>
  <text class="name" x="55" y="224">F</text>
  <text class="txt" x="100" y="224">Suchmaschinenoptimierung (SEO)</text>
  <text class="txt" x="635" y="224" text-anchor="middle">15</text>
  <text class="txt" x="775" y="224" text-anchor="middle">E</text>
  <text class="name" x="55" y="254">G</text>
  <text class="txt" x="100" y="254">Cloud Server auswählen</text>
  <text class="txt" x="635" y="254" text-anchor="middle">8</text>
  <text class="txt" x="775" y="254" text-anchor="middle">B</text>
  <text class="name" x="55" y="284">H</text>
  <text class="txt" x="100" y="284">Cloud Server mieten</text>
  <text class="txt" x="635" y="284" text-anchor="middle">2</text>
  <text class="txt" x="775" y="284" text-anchor="middle">G</text>
  <text class="name" x="55" y="314">I</text>
  <text class="txt" x="100" y="314">Testen und Qualitätssicherung</text>
  <text class="txt" x="635" y="314" text-anchor="middle">16</text>
  <text class="txt" x="775" y="314" text-anchor="middle">E</text>
  <text class="name" x="55" y="344">J</text>
  <text class="txt" x="100" y="344">Website-Launch</text>
  <text class="txt" x="635" y="344" text-anchor="middle">4</text>
  <text class="txt" x="775" y="344" text-anchor="middle">F, I, H</text>
</svg>
