<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 368" width="888" height="368"
     role="img" aria-label="Gelöstes Gantt-Diagramm mit sieben Vorgängen über 18 Tage">
  <title>Musterlösung 4 ba) — Gantt-Diagramm</title>
  <desc>Vorgang A Tag 1 bis 3, B 4 bis 9, C 10 bis 13, D 4 bis 11, E 4 bis 8, F 14 bis 16, G 17 bis 18. Das Projekt ist nach 18 Tagen beendet.</desc>

  <style>
    .rahmen{fill:none;stroke:#14171C;stroke-width:1.8}
    .fall{fill:#FFFFFF;stroke:#14171C;stroke-width:1.8}
    .fall.neu{fill:#EAF0F7;stroke:#12457E;stroke-width:2.4}
    .lin{fill:none;stroke:#14171C;stroke-width:1.5}
    .inc{fill:none;stroke:#12457E;stroke-width:1.5;stroke-dasharray:6 4}
    .fig{fill:none;stroke:#14171C;stroke-width:1.8;stroke-linecap:round}
    .fig.neu{stroke:#12457E;stroke-width:2.4}
    .t{font-family:"Segoe UI",-apple-system,Roboto,sans-serif;font-size:14px;
       fill:#14171C;text-anchor:middle}
    .t.neu{fill:#12457E;font-weight:700}
    .klein{font-family:"Segoe UI",-apple-system,Roboto,sans-serif;font-size:11.5px;
           fill:#12457E;text-anchor:middle;font-style:italic}
    .kopf{font-family:"Segoe UI",-apple-system,Roboto,sans-serif;font-size:12.5px;
          font-weight:700;fill:#14171C}
    .zell{font-family:"Segoe UI",-apple-system,Roboto,sans-serif;font-size:12px;
          fill:#14171C;text-anchor:middle}
    .gitter{fill:none;stroke:#9AA1AC;stroke-width:0.8}
    .rand{fill:none;stroke:#14171C;stroke-width:1.6}
    .balken{fill:#12457E}
    .balken.vorgabe{fill:#9AA6B6}
    .balken.puffer{fill:#D8DCE2}
    .pfeil{fill:none;stroke:#A8291F;stroke-width:1.4}
    .legende{font-family:"Segoe UI",-apple-system,Roboto,sans-serif;font-size:11.5px;
             fill:#5E6570}
    @media (prefers-color-scheme: dark){
      .rahmen,.lin,.fig{stroke:#E8EAEE}
      .fall{fill:#1B1F26;stroke:#E8EAEE}
      .fall.neu{fill:#1D2A3A;stroke:#6FA8E8}
      .fig.neu,.inc{stroke:#6FA8E8}
      .t,.kopf,.zell{fill:#E8EAEE}
      .t.neu,.klein{fill:#6FA8E8}
      .rand{stroke:#E8EAEE}
      .gitter{stroke:#4A515C}
      .balken{fill:#6FA8E8} .balken.vorgabe{fill:#5A6472} .balken.puffer{fill:#333A45}
      .pfeil{stroke:#E88178}
      .legende{fill:#98A0AC}
    }
  </style>
  <defs>
    <marker id="sp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="context-stroke" stroke-width="1.6"/>
