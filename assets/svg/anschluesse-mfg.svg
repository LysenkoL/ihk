<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170"
     role="img" aria-label="Vier Anschlussbuchsen, nummeriert 1 bis 4: USB Typ A, RJ45, Kaltgerätebuchse, USB Typ C">
  <title>Anschlüsse des Multifunktionsgeräts, Abbildungen 1 bis 4</title>
  <desc>Abbildung 1: flache, breite Buchse mit vier Kontakten im unteren Bereich.
        Abbildung 2: quadratische Buchse mit Rastnase unten und acht Kontakten.
        Abbildung 3: Buchse mit abgeschrägten oberen Ecken und drei Kontaktschlitzen.
        Abbildung 4: schmale Buchse mit vollständig abgerundeten Enden.</desc>

  <style>
    .lin  { fill: none; stroke: #14171C; stroke-width: 6; stroke-linejoin: round; }
    .voll { fill: #14171C; }
    .weiss{ fill: #FFFFFF; }
    .nr   { fill: none; stroke: #14171C; stroke-width: 2.5; }
    .nrt  { font-family: "Segoe UI", -apple-system, Roboto, sans-serif; font-size: 17px;
            font-weight: 700; fill: #14171C; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .lin, .nr { stroke: #E8EAEE; }
      .voll { fill: #E8EAEE; }
      .weiss{ fill: #14171C; }
      .nrt  { fill: #E8EAEE; }
    }
  </style>

  <!-- ============ 1 · USB Typ A ============ -->
  <rect class="nr" x="20" y="24" width="26" height="26" rx="3"/>
  <text class="nrt" x="33" y="43">1</text>
  <g transform="translate(70,62)">
    <rect class="lin" x="0" y="0" width="128" height="52" rx="7"/>
    <rect class="voll" x="18" y="28" width="18" height="14" rx="2"/>
    <rect class="voll" x="44" y="28" width="18" height="14" rx="2"/>
    <rect class="voll" x="70" y="28" width="18" height="14" rx="2"/>
    <rect class="voll" x="96" y="28" width="14" height="14" rx="2"/>
  </g>

  <!-- ============ 2 · RJ45 ============ -->
  <rect class="nr" x="238" y="24" width="26" height="26" rx="3"/>
  <text class="nrt" x="251" y="43">2</text>
  <g transform="translate(288,40)">
    <!-- Gehäuse mit Rastnase unten -->
    <path class="lin" d="M 4 0 H 84 A 4 4 0 0 1 88 4 V 86 A 4 4 0 0 1 84 90 H 60
                         V 104 A 4 4 0 0 1 56 108 H 32 A 4 4 0 0 1 28 104 V 90
                         H 4 A 4 4 0 0 1 0 86 V 4 A 4 4 0 0 1 4 0 Z"/>
    <!-- acht Kontakte -->
    <g class="voll">
      <rect x="16" y="18" width="6" height="34" rx="1"/>
      <rect x="26" y="18" width="6" height="34" rx="1"/>
      <rect x="36" y="18" width="6" height="34" rx="1"/>
      <rect x="46" y="18" width="6" height="34" rx="1"/>
      <rect x="56" y="18" width="6" height="34" rx="1"/>
      <rect x="66" y="18" width="6" height="34" rx="1"/>
    </g>
  </g>

  <!-- ============ 3 · Kaltgerätebuchse (IEC C14) ============ -->
  <rect class="nr" x="440" y="24" width="26" height="26" rx="3"/>
  <text class="nrt" x="453" y="43">3</text>
  <g transform="translate(490,54)">
    <path class="voll" d="M 0 30 A 8 8 0 0 1 8 22 L 22 4 A 8 8 0 0 1 28 1
                          H 92 A 8 8 0 0 1 98 4 L 112 22 A 8 8 0 0 1 120 30
                          V 62 A 8 8 0 0 1 112 70 H 8 A 8 8 0 0 1 0 62 Z"/>
    <!-- drei Kontaktschlitze -->
    <rect class="weiss" x="24" y="20" width="14" height="24" rx="3"/>
    <rect class="weiss" x="82" y="20" width="14" height="24" rx="3"/>
    <rect class="weiss" x="53" y="40" width="14" height="22" rx="3"/>
  </g>

  <!-- ============ 4 · USB Typ C ============ -->
  <rect class="nr" x="640" y="24" width="26" height="26" rx="3"/>
  <text class="nrt" x="653" y="43">4</text>
  <g transform="translate(676,72)">
    <rect class="lin" x="0" y="0" width="70" height="34" rx="17"/>
    <rect class="voll" x="13" y="12" width="44" height="10" rx="5"/>
  </g>
</svg>
